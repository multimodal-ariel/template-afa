hydra:
  job:
    name: big5
  sweep:
    dir: outputs/${hydra.job.name}/difa/${now:%Y%m%d}_${now:%H%M%S}
    subdir: ${hydra.job.num}
  launcher:
    n_jobs: 8

difa_cfg:
  data: load_aaco_data/big5_C_cls/true
  name: difa
  problem: difa
  hidden_dim: 256
  embed_dim: 32
  depth: 2
  iters: 1000
  batch_size: 8192
  ppo_batch_size: 8192
  dropout: .05
  acquisition_cost: .05 # TODO: override this
  pretrain_iters: 1
  warmup_iters: 20
  lr: 2e-4
  base_lr: 1e-6
  policy_lr: 2e04
  policy_base_lr: 2e-4
  latent_dim: 64
imputation_model_cfg:
  exp_p: experiments/baselines/difa/outputs/big5/vaeac/20250401_122828
  run_id: 0
  model_p: outputs/models/vaeac.pt
plf:
  _target_: lightning.Fabric
  accelerator: auto
