hydra:
  job:
    name: charfont-1500
  run:
    dir: outputs/${hydra.job.name}/${now:%Y%m%d}_${now:%H%M%S}
  # sweep:
  #   dir: outputs/${hydra.job.name}/${now:%Y%m%d}_${now:%H%M%S}
  #   subdir: ${hydra.job.num}
  # launcher:
  #   n_jobs: 8

data:
  _target_: mydatasets.aaco.load_aaco_data
  name: charfont-1500
  to_normalize: true
n_masks: 100_000
nnet:
  _target_: mymodels.nn.make_fcn
  layer_specs: [
      [1024, "${get_cls: torch.nn.ReLU}", null, null], # two layers
      [2048, "${get_cls: torch.nn.ReLU}", null, 0.5], # two layers
      [2048, "${get_cls: torch.nn.ReLU}", null, 0.5], # two layers
      [1024, "${get_cls: torch.nn.ReLU}", null, null], # two layers
    ]
nnet_fit_cfg:
  opt_type: "${get_cls: torch.optim.Adam}"
  opt_kwargs:
    lr: 1e-3
  n_iter: 10_000
  bsz: 4096
plf:
  _target_: lightning.Fabric
  accelerator: auto
