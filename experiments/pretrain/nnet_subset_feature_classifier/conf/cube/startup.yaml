hydra:
  job:
    name: cube
  run:
    dir: outputs/${hydra.job.name}/${now:%Y%m%d}_${now:%H%M%S}
  # sweep:
  #   dir: outputs/${hydra.job.name}/${now:%Y%m%d}_${now:%H%M%S}
  #   subdir: ${hydra.job.num}
  # launcher:
  #   n_jobs: 8

data:
  _target_: mydatasets.aaco.load_aaco_data
  name: cube_20_0.3
  to_normalize: true
n_masks: 100_000
nnet:
  _target_: mymodels.nn.make_fcn
  layer_specs: [
      [
        32,
        "${get_cls: torch.nn.LazyBatchNorm1d}",
        "${get_cls: torch.nn.ELU}",
        null,
      ], # two layers
      # [
      #   32,
      #   "${get_cls: torch.nn.LazyBatchNorm1d}",
      #   "${get_cls: torch.nn.ELU}",
      #   null,
      # ], # two layers
    ]
nnet_fit_cfg:
  opt_type: "${get_cls: torch.optim.Adam}"
  opt_kwargs:
    lr: 1e-3
  n_iter: 50_000
  bsz: 128
plf:
  _target_: lightning.Fabric
  accelerator: auto
