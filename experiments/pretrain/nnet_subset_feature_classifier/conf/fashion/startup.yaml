hydra:
  job:
    name: fashion
  run:
    dir: outputs/${hydra.job.name}/${now:%Y%m%d}_${now:%H%M%S}
  # sweep:
  #   dir: outputs/${hydra.job.name}/${now:%Y%m%d}_${now:%H%M%S}
  #   subdir: ${hydra.job.num}
  # launcher:
  #   n_jobs: 8

data:
  _target_: mydatasets.aaco.load_aaco_data
  name: fashion-mnist
  to_normalize: true
n_masks: 100_000
nnet:
  _target_: mymodels.nn.make_fcn
  layer_specs:
    [
      [
        512,
        "${get_cls: torch.nn.BatchNorm1d}",
        "${get_cls: torch.nn.ReLU}",
        null,
      ],
      [
        512,
        "${get_cls: torch.nn.BatchNorm1d}",
        "${get_cls: torch.nn.ReLU}",
        null,
      ],
      [
        512,
        "${get_cls: torch.nn.BatchNorm1d}",
        "${get_cls: torch.nn.ReLU}",
        null,
      ],
    ]
nnet_fit_cfg:
  opt_type: "${get_cls: torch.optim.Adam}"
  opt_kwargs:
    lr: 1e-3
  n_iter: 10_000
  bsz: 12800
plf:
  _target_: lightning.Fabric
  accelerator: auto
