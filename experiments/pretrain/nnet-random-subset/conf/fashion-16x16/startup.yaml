hydra:
  job:
    name: fashion-16x16
  run:
    dir: outputs/${hydra.job.name}/${now:%Y%m%d}_${now:%H%M%S}
  # sweep:
  #   dir: outputs/${hydra.job.name}/${now:%Y%m%d}_${now:%H%M%S}
  #   subdir: ${hydra.job.num}
  # launcher:
  #   n_jobs: 8

data:
  _target_: mydatasets.aaco.load_aaco_data
  name: fashion-mnist-16x16
  to_normalize: true
n_masks: 256
nnet:
  _target_: mymodels.nn.make_fcn
  layer_specs: [
      [512, "${get_cls: torch.nn.ReLU}", null, null], # two layers
      [512, "${get_cls: torch.nn.ReLU}", null, null], # two layers
    ]
nnet_fit_cfg:
  opt_type: "${get_cls: torch.optim.AdamW}"
  opt_kwargs:
    lr: 1e-3
    amsgrad: true
  n_iter_warmup: 10
  n_iter: 200
  bsz: 12800
  eval_every_n_iter: 10
# nnet_fit_cfg:
#   opt_type: "${get_cls: torch.optim.Adam}"
#   opt_kwargs:
#     lr: 1e-3
#   n_iter: 1_000_000
#   bsz: 4096
plf:
  _target_: lightning.Fabric
  accelerator: auto
