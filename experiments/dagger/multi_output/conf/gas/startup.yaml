hydra:
  job:
    name: gas
  sweep:
    dir: outputs/${hydra.job.name}/${now:%Y%m%d}_${now:%H%M%S}
    subdir: ${hydra.job.num}
  launcher:
    n_jobs: 8

# TODO override one of these
# mktmpl_exp:
#   exp_p: str
#   run_id: int
# mktmpl_run: str
nnet:
  _target_: mymodels.nn.make_fcn
  layer_specs: [[64, null, null, null], [64, null, null, null]]
opt:
  _target_: torch.optim.Adam
  lr: 1e-4
warmup_nnet_tcfg:
  n_fit_iter: 5_000
  bsz: 1024
  save_ckpt_every_n_iter: 500
dagger_nnet_tcfg:
  n_fit_iter: 1_000_000
  bsz: 32
  eval_every_n_iter: 100
  save_ckpt_every_n_iter: 5000
plf:
  _target_: lightning.Fabric
  accelerator: auto
