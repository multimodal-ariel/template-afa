hydra:
  job:
    name: mnist
  sweep:
    dir: outputs/${hydra.job.name}/${now:%Y%m%d}_${now:%H%M%S}
    subdir: ${hydra.job.num}
  launcher:
    n_jobs: 8

data:
  # NOTE mnist length of xs and length of ys in mnist does not match
  _target_: mydatasets.aaco.load_aaco_data
  name: mnist
  to_normalize: true
tclassifier:
  _target_: _classifiers.SubsetFeatureConcatXGBClassifier
  xgb_kwargs:
    n_estimators: 100
  fraction_training_data_per_split: 1.0
  n_splits: 64
  n_tmpl_per_instance: 4
vclassifier:
  _target_: mymodels.classifiers.SubsetFeatureXGBClassifier
  xgbc_kwargs:
    n_estimators: 100
# make_templates_fn:
#   TODO override this
#   _target_: ...
init_fidx: 100
lmbda: 0.1
n_neighs: 100
bsz: 8
