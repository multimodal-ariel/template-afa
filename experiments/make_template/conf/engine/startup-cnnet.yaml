hydra:
  job:
    name: engine-cnnet
  sweep:
    dir: outputs/${hydra.job.name}/${now:%Y%m%d}_${now:%H%M%S}
    subdir: ${hydra.job.num}
  launcher:
    n_jobs: 8

data:
  _target_: mydatasets.aaco.load_aaco_data
  name: engine-fault
  to_normalize: true
tclassifier:
  _target_: _classifiers.make_concat_nnet_classifier_from_pretrain_run
  # run_p: experiments/pretrain/nnet_subset_feature_classifier/outputs/cube/20251211_152751/
  run_p: experiments/pretrain/nnet-random-subset/outputs/engine/20260110_193452
  fit_kwargs:
    opt_type: "${get_cls: torch.optim.AdamW}"
    opt_kwargs:
      lr: 1e-3
    n_iter: 100
    bsz: 4096
vclassifier: null
# make_templates_fn:
#   TODO override this
#   _target_: ...
init_fidx: 6
lmbda: 0.3
bsz: 1024
n_neighs: 10
plf:
  _target_: lightning.Fabric
  accelerator: auto
