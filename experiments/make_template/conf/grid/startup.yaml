hydra:
  job:
    name: grid
  sweep:
    dir: outputs/${hydra.job.name}/${now:%Y%m%d}_${now:%H%M%S}
    subdir: ${hydra.job.num}
  launcher:
    n_jobs: 8

data:
  _target_: mydatasets.aaco.load_aaco_data
  name: grid_data
  to_normalize: true
tclassifier:
  _target_: mymodels.classifiers.SubsetFeatureConcatXGBClassifier
  xgb_kwargs:
    n_estimators: 40
  fraction_training_data_per_split: 1.0
  n_splits: 64
  n_tmpl_per_instance: 4
vclassifier:
  _target_: mymodels.classifiers.SubsetFeatureXGBClassifier
  xgbc_kwargs:
    n_estimators: 40
# make_templates_fn:
#   TODO override this
#   _target_: ...
init_fidx: 1
lmbda: 0.5
n_neighs: 10
bsz: 1024
plf:
  _target_: lightning.Fabric
  accelerator: cpu
