hydra:
  job:
    name: cube-linear
  sweep:
    dir: outputs/${hydra.job.name}/${now:%Y%m%d}_${now:%H%M%S}
    subdir: ${hydra.job.num}
  launcher:
    n_jobs: 8

data:
  _target_: mydatasets.aaco.load_aaco_data
  name: cube_20_0.3
  to_normalize: false
tclassifier:
  _target_: _classifiers.make_concat_nnet_classifier_from_pretrain_run
  # run_p: experiments/pretrain/nnet_subset_feature_classifier/outputs/cube/20251211_152751/
  # run_p: experiments/pretrain/nnet-random-subset/outputs/cube-linear/20260105_220207
  run_p: experiments/pretrain/nnet_subset_feature_classifier/outputs/cube-linear/20260105_221709
  fit_kwargs:
    opt_type: "${get_cls: torch.optim.Adam}"
    opt_kwargs:
      lr: 1e-3
    n_iter: 50
    bsz: 409600
vclassifier: null
