hydra:
  job:
    name: cube-xgbc
  sweep:
    dir: outputs/${hydra.job.name}/${now:%Y%m%d}_${now:%H%M%S}
    subdir: ${hydra.job.num}
  launcher:
    n_jobs: 8

data:
  _target_: mydatasets.aaco.load_aaco_data
  name: cube_20_0.3
  to_normalize: false
tclassifier:
  _target_: mymodels.classifiers.SubsetFeatureConcatXGBClassifier
  xgb_kwargs:
    n_estimators: 10
    max_depth: 5
    n_jobs: 3
    device: cuda
  fraction_training_data_per_split: 1.0
  n_splits: 3
  n_tmpl_per_instance: 5
vclassifier: null
# make_templates_fn:
#   TODO override this
#   _target_: ...
init_fidx: 6
lmbda: 0.3
bsz: 1024
n_neighs: 10
plf:
  _target_: lightning.Fabric
  accelerator: cpu
