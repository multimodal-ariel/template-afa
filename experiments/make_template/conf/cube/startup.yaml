hydra:
  job:
    name: cube
  sweep:
    dir: outputs/${hydra.job.name}/${now:%Y%m%d}_${now:%H%M%S}
    subdir: ${hydra.job.num}
  launcher:
    n_jobs: 8

data:
  _target_: mydatasets.aaco.load_aaco_data
  name: cube_20_0.3
  to_normalize: false
classifier:
  _target_: _classifiers.SubsetFeatureNaiveBayes
  std: 0.3
init_fidx: 6
n_tmpls_targ: 64
n_cands_targ: 10_000
min_features_targ: 1
max_features_targ: null
min_features_init: 10
feature_decrement: 2
lmbda: 0.3
bsz: 1024
max_tdata: null
