hydra:
  job:
    name: cube
  sweep:
    dir: outputs/${hydra.job.name}/${now:%Y%m%d}_${now:%H%M%S}
    subdir: ${hydra.job.num}
  launcher:
    n_jobs: 8

data:
  _target_: mydatasets.aaco.load_aaco_data
  name: cube_20_0.3
  to_normalize: false
tclassifier:
  _target_: _classifiers.SubsetFeatureNaiveBayes
  std: 0.3
vclassifier: null
# make_templates_fn:
#   TODO override this
#   _target_: ...
# init_fidx: null
lmbda: 0.3
bsz: 1024
n_neighs: 10
plf:
  _target_: lightning.Fabric
  accelerator: cpu
