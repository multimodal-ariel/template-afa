hydra:
  job:
    name: volvo_cnnet
  sweep:
    dir: outputs/${hydra.job.name}/${now:%Y%m%d}_${now:%H%M%S}
    subdir: ${hydra.job.num}
  launcher:
    n_jobs: 8

data:
  # NOTE mnist length of xs and length of ys in mnist does not match
  _target_: mydatasets.aaco.load_aaco_data
  name: volvo
  to_normalize: true
tclassifier:
  _target_: _classifiers.make_concat_nnet_classifier_from_pretrain_run
  run_p: experiments/pretrain/nnet_subset_feature_classifier/outputs/volvo
  fit_kwargs:
    opt_type: "${get_cls: torch.optim.Adam}"
    opt_kwargs:
      lr: 1e-3
    n_iter: 5_000
    bsz: 81920
vclassifier: null
# make_templates_fn:
#   TODO override this
#   _target_: ...
init_fidx: 100
lmbda: 0.1
n_neighs: 100
bsz: 81920
plf:
  _target_: lightning.Fabric
  accelerator: auto
