hydra:
  job:
    name: fashion-16x16-xgb
  sweep:
    dir: outputs/${hydra.job.name}/${now:%Y%m%d}_${now:%H%M%S}
    subdir: ${hydra.job.num}
  launcher:
    n_jobs: 8

data:
  # NOTE mnist length of xs and length of ys in mnist does not match
  _target_: mydatasets.aaco.load_aaco_data
  name: fashion-mnist-16x16
  to_normalize: true
tclassifier:
  _target_: _classifiers.FashionMNIST16x16XGBClassifier
  model_p: /home/hungtien/Documents/research/afa/template-afa/libs/external/aacolib/_saved_models/fashion-16x16_xgb_classifier_arb_subsets.json
vclassifier: null
# make_templates_fn:
#   TODO override this
#   _target_: ...
init_fidx: 100
lmbda: 0.1
n_neighs: 100
bsz: 8
plf:
  _target_: lightning.Fabric
  accelerator: cpu
