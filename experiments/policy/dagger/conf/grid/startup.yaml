hydra:
  job:
    name: grid
  sweep:
    dir: outputs/${hydra.job.name}/${now:%Y%m%d}_${now:%H%M%S}
    subdir: ${hydra.job.num}
  launcher:
    n_jobs: 8

# TODO override one of these
# mktmpl_exp:
#   exp_p: str
#   run_id: int
# mktmpl_run: str
max_rplbuf_size: 100_000
nnet:
  _target_: mymodels.nn.make_fcn
  layer_specs:
    [
      [64, null, "${get_cls: torch.nn.ReLU}", null],
      [64, null, "${get_cls: torch.nn.ReLU}", null],
    ]
warmup_nnet_tcfg:
  opt:
    _target_: torch.optim.Adam
    lr: 1e-3
  n_fit_iter: 100
  bsz: 1024
  save_ckpt_every_n_iter: 100
dagger_nnet_tcfg:
  opt:
    _target_: torch.optim.Adam
    lr: 1e-5
  to_reset_nnet_after_dagger_rollout: false
  n_fit_iter: 1_000
  n_dagger_rollout: 128
  n_opt_step_per_iter: 50
  bsz: 1024
  eval_every_n_iter: 100
  save_ckpt_every_n_iter: 500
plf:
  _target_: lightning.Fabric
  accelerator: auto
