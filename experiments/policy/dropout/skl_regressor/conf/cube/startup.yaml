hydra:
  job:
    name: cube
  sweep:
    dir: outputs/${hydra.job.name}/${now:%Y%m%d}_${now:%H%M%S}
    subdir: ${hydra.job.num}
  launcher:
    n_jobs: 8

# TODO override one of these
# mktmpl_exp:
#   exp_p: str
#   run_id: int
# mktmpl_run: str
n_pairs_per_sample: 256
sklr:
  _target_: xgboost.XGBRegressor
  objective: "reg:squarederror"
  n_estimators: 400
  tree_method: "hist"
  random_state: 42
plf:
  _target_: lightning.Fabric
  accelerator: auto
