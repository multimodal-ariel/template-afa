hydra:
  job:
    name: gas
  sweep:
    dir: outputs/${hydra.job.name}/${now:%Y%m%d}_${now:%H%M%S}
    subdir: ${hydra.job.num}
  launcher:
    n_jobs: 8

data:
  _target_: mydatasets.aaco.load_aaco_data
  name: gas
  to_normalize: true
tclassifier:
  _target_: _classifiers.SubsetFeatureConcatXGBClassifier
  xgb_kwargs:
    n_estimators: 40
  fraction_training_data_per_split: 1.0
  n_splits: 64
  n_tmpl_per_instance: 4
vclassifier:
  _target_: mymodels.classifiers.SubsetFeatureXGBClassifier
  xgbc_kwargs:
    n_estimators: 40
nnet:
  _target_: mymodels.nn.make_fcn
  layer_specs: [[64, null, null, null], [64, null, null, null]]
opt:
  _target_: torch.optim.Adam
  lr: 1e-4
nnet_tcfg:
  n_fit_iter: 1_000
  bsz: 1024
# make_templates_fn:
#   TODO override this
#   _target_: ...
init_fidx: 6
lmbda: 0.05
n_neighs: 10
bsz: 1024
