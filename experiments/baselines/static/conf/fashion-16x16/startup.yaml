hydra:
  job:
    name: fashion-16x16
  sweep:
    dir: outputs/${hydra.job.name}/${now:%Y%m%d}_${now:%H%M%S}
    subdir: ${hydra.job.num}
  launcher:
    n_jobs: 8

data:
  # NOTE mnist length of xs and length of ys in mnist does not match
  _target_: mydatasets.aaco.load_aaco_data
  name: fashion-mnist-16x16
  to_normalize: true
n_feats: 10  # TODO override this
classifier:
  _target_: xgboost.XGBClassifier
  n_estimators: 1024
