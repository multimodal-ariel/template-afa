hydra:
  job:
    name: cube
  sweep:
    dir: outputs/${hydra.job.name}/vaeac/${now:%Y%m%d}_${now:%H%M%S}
    subdir: ${hydra.job.num}
  launcher:
    n_jobs: 8

difa_cfg:
  data: load_aaco_data/cube_20_0.3/false
  name: vaeac
  problem: vaeac
  hidden_dim: 32
  embed_dim: 32
  depth: 2
  iters: 1000
  batch_size: 16384
  ppo_batch_size: 16384
  dropout: .05
  acquisition_cost: .05 # TODO: override this
  warmup_iters: 20
  lr: 2e-4
  base_lr: 1e-6
  policy_lr: 2e04
  policy_base_lr: 2e-4
  latent_dim: 32
plf:
  _target_: lightning.Fabric
  accelerator: auto
