hydra:
  job:
    name: gas
  sweep:
    dir: outputs/${hydra.job.name}/difa/${now:%Y%m%d}_${now:%H%M%S}
    subdir: ${hydra.job.num}
  launcher:
    n_jobs: 8

difa_cfg:
  data: load_aaco_data/gas/true
  name: difa
  problem: difa
  hidden_dim: 64
  embed_dim: 64
  depth: 2
  iters: 1000
  batch_size: 8192
  ppo_batch_size: 8192
  dropout: .05
  # acquisition_cost: .05 # from imputation model
  warmup_iters: 20
  lr: 2e-4
  base_lr: 1e-6
  policy_lr: 2e04
  policy_base_lr: 2e-4
  latent_dim: 32
imputation_model_cfg:
  exp_p: experiments/baselines/difa/outputs/gas/vaeac/20250401_132216
  # run_id: # TODO override this
  model_p: outputs/models/vaeac.pt
plf:
  _target_: lightning.Fabric
  accelerator: auto
