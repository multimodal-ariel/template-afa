hydra:
  job:
    name: ct-slice-rel-loc
  sweep:
    dir: outputs/${hydra.job.name}/${now:%Y%m%d}_${now:%H%M%S}
    subdir: ${hydra.job.num}
  launcher:
    n_jobs: 8

data:
  _target_: mydatasets.aaco.load_aaco_data
  name: ct-slice-rel-loc
  to_normalize: true
init_fidx: 100
lmbda: 0.5
n_neighs: 20
eval_bsz: 32
