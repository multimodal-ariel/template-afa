hydra:
  job:
    name: big5
  sweep:
    dir: outputs/${hydra.job.name}/${now:%Y%m%d}_${now:%H%M%S}
    subdir: ${hydra.job.num}
  launcher:
    n_jobs: 8

data:
  _target_: mydatasets.aaco.load_aaco_data
  name: big5_C_cls
  to_normalize: true
plf:
  _target_: lightning.Fabric
  accelerator: auto
jafa_cfg:
  r_cost: -0.05 # TODO this seems to control penalty for feature(?)
  pretrain: 20_000
  dropout: true
  batchnorm: true
  p: 0.5
  embedder_hidden_sizes: [256, 256]
  clf_hidden_sizes: [256, 256]
  policy_hidden_sizes: [256]
  shared_dim: 256
  n_envs: 64
  nsteps: 10
  normalize: true
  embedded_dim: 256
  lstm_size: 256
  batch_size: 128
