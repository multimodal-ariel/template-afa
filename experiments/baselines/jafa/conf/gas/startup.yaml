hydra:
  job:
    name: gas
  sweep:
    dir: outputs/${hydra.job.name}/${now:%Y%m%d}_${now:%H%M%S}
    subdir: ${hydra.job.num}
  launcher:
    n_jobs: 8

data:
  _target_: mydatasets.aaco.load_aaco_data
  name: gas
  to_normalize: true
plf:
  _target_: lightning.Fabric
  accelerator: auto
jafa_cfg:
  r_cost: -0.05 # TODO this seems to control penalty for feature(?)
  pretrain: 5_000
  dropout: true
  batchnorm: true
  p: 0.5
  embedder_hidden_sizes: [64, 64]
  clf_hidden_sizes: [64, 64]
  policy_hidden_sizes: [64]
  shared_dim: 32
  n_envs: 64
  nsteps: 8
  normalize: true
  embedded_dim: 32
  lstm_size: 32
  batch_size: 1024
